name: 任务完成自动更新
on:
  workflow_dispatch:
    inputs:
      task_name:
        description: '完成的任务名称（如：拉建项目协同群）'
        required: true
        type: string
      completed_by:
        description: '完成人（如：Kevin）'
        required: true
        type: string
      note:
        description: '补充说明（可选）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新任务状态
        env:
          TASK_NAME: ${{ inputs.task_name }}
          COMPLETED_BY: ${{ inputs.completed_by }}
        run: python3 scripts/task_complete.py

      - name: 提交并推送
        run: |
          git config user.name "VCC Bot"
          git config user.email "bot@vcc.internal"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "自动更新：${{ inputs.completed_by }} 完成「${{ inputs.task_name }}」"
            git push
          fi
