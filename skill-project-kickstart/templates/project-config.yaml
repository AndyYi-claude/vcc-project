# --- 关键决策 ---
decisions:
  - "决策 1"
  - "决策 2"

# --- 进展总览（右栏卡片，多个分组）---
progress_sections:
  - title: "模块 A 进展"
    headers: ["事项", "状态", "下一步"]
    rows:
      - ["事项1", "状态", "下一步"]
      - ["事项2", "状态", "下一步"]
  - title: "模块 B 进展"
    headers: ["事项", "状态"]
    rows:
      - ["事项1", "状态"]
      - ["事项2", "状态"]

# --- GitHub 信息 ---
github:
  username: "your-username"  # GitHub 用户名
  repo: "your-repo-name"     # 仓库名
